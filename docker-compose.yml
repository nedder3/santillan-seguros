services:
  mariadb:
    image: mariadb:11.4
    container_name: santillan_seguros_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: santillan_seguros
      MARIADB_USER: santillan
      MARIADB_PASSWORD: santillan123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: santillan_seguros_app
    restart: unless-stopped
    environment:
      - ConnectionStrings__MariaDb=Server=mariadb;Port=3306;Database=santillan_seguros;User ID=santillan;Password=santillan123;Connection Timeout=10;
      - SCREEN_WIDTH=1366
      - SCREEN_HEIGHT=768
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
