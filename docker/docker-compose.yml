services:
  mariadb:
    image: mariadb:11.4
    container_name: santillan_seguros_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: santillan_seguros
      MARIADB_USER: santillan
      MARIADB_PASSWORD: santillan123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
